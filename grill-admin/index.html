<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>لوحة التحكم — GRILL HOUSE</title>
    <!-- The one restaurant this dashboard manages (restaurants.slug). -->
    <meta name="restaurant-slug" content="grill-house" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/grill-admin/dashboard.css" />
  </head>
  <body>
    <!-- Icons: the public menu's own sprite paths (restaurants/grill-house/
         index.html), plus a few controls it does not have, drawn the same way. -->
    <svg class="sprite" aria-hidden="true">
      <defs>
        <symbol id="i-flame" viewBox="0 0 24 24">
          <path d="M12 2c1.4 2.6-1.6 3.8-1.6 6.8a3.6 3.6 0 0 0 7.2 0c0-1.3-.6-2.1-1-2.6.1 1.3-.7 1.9-.7 1.9.4-2.6-1.7-3.6-1.9-5.4-.8 1-2 1.8-2 -.7z" />
          <path d="M8.4 13a5.6 5.6 0 1 0 11.2 0c0-1-.3-1.8-.6-2.4" />
        </symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8" /><path d="M5 10v10h14V10" /></symbol>
        <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12" /><path d="M4 6h.01M4 12h.01M4 18h.01" /></symbol>
        <symbol id="i-burger" viewBox="0 0 24 24">
          <path d="M4 10h16" />
          <path d="M3 14h18a1 1 0 0 1 1 1 4 4 0 0 1-4 4H6a4 4 0 0 1-4-4 1 1 0 0 1 1-1z" />
          <path d="M5 10a7 5 0 0 1 14 0" />
        </symbol>
        <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 8h.01" /><path d="M11 11.5h1.2v5.5" /></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /><path d="M12 15v2" /></symbol>
        <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18" /></symbol>
        <symbol id="i-image" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="16" rx="2" />
          <circle cx="8.5" cy="9.5" r="1.5" fill="currentColor" stroke="none" />
          <path d="M21 16.5 15.6 11a2 2 0 0 0-2.8 0L3 20" />
        </symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></symbol>
        <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></symbol>
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
        <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5" /><circle cx="12" cy="12" r="4" /><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none" /></symbol>
        <symbol id="i-tiktok" viewBox="0 0 24 24"><path d="M14 3v10.8a3.6 3.6 0 1 1-2.2-3.3" /><path d="M14 3c.3 2.2 1.9 3.9 4.2 4.2" /></symbol>
        <symbol id="i-facebook" viewBox="0 0 24 24"><path d="M14 9h3V6h-3a4 4 0 0 0-4 4v2H7v3h3v6h3v-6h3l1-3h-4v-2a1 1 0 0 1 1-1z" /></symbol>
        <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8.1 18.8z" /><path d="M9.2 8.6c.2-.5.6-.6 1-.5l.9 2-.7.9a5.4 5.4 0 0 0 2.6 2.6l.9-.7 2 .9c.1.4 0 .8-.5 1-2.9 1.1-7.3-3.3-6.2-6.2z" /></symbol>
      </defs>
    </svg>

    <!-- Shown while the stored session is checked. -->
    <main class="auth-screen" id="view-loading" aria-live="polite">
      <p class="auth-loading">جارٍ التحقق من الجلسة…</p>
    </main>

    <main class="auth-screen" id="view-login" hidden>
      <section class="auth-card">
        <div class="wordmark wordmark-large">
          <svg class="wordmark-flame" aria-hidden="true"><use href="#i-flame"></use></svg>
          <span class="wordmark-name">GRILL HOUSE</span>
          <span class="wordmark-est">EST. 2024</span>
        </div>
        <span class="accent-line" aria-hidden="true"></span>
        <h1 class="auth-title">تسجيل الدخول إلى لوحة التحكم</h1>
        <p class="muted">سجّل الدخول بحساب مخوّل لإدارة مطعم GRILL HOUSE.</p>
        <form id="login-form" class="form" novalidate>
          <div class="field">
            <label for="login-email">البريد الإلكتروني</label>
            <input id="login-email" name="email" type="email" autocomplete="username" dir="ltr" required />
          </div>
          <div class="field">
            <label for="login-password">كلمة المرور</label>
            <input id="login-password" name="password" type="password" autocomplete="current-password" dir="ltr" required />
          </div>
          <p class="alert" id="login-message" role="alert" hidden></p>
          <button class="btn btn-primary btn-block" id="login-submit" type="submit">تسجيل الدخول</button>
        </form>
        <a class="auth-back" href="/">العودة إلى المنيو</a>
      </section>
    </main>

    <div class="app" id="view-app" hidden>
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-button nav-toggle" id="nav-toggle" type="button" aria-label="فتح القائمة"
            aria-controls="sidebar" aria-expanded="false">
            <svg aria-hidden="true"><use href="#i-menu"></use></svg>
          </button>
          <a class="topbar-brand" href="#home">
            <svg class="wordmark-flame" aria-hidden="true"><use href="#i-flame"></use></svg>
            <span class="wordmark-name" id="brand-name">GRILL HOUSE</span>
          </a>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-sub">لوحة التحكم</span>
        </div>
        <div class="topbar-end">
          <span class="user-email" id="user-email" dir="ltr"></span>
          <a class="btn btn-ghost" id="store-link" href="/" target="_blank" rel="noopener"
            ><span class="label-long">عرض المنيو العام</span><span class="label-short">المنيو</span></a>
          <button class="btn btn-outline" id="logout-btn" type="button">تسجيل الخروج</button>
        </div>
      </header>

      <div class="layout">
        <nav class="sidebar" id="sidebar" aria-label="أقسام لوحة التحكم">
          <div class="sidebar-head">
            <button class="icon-button nav-close" id="nav-close" type="button" aria-label="إغلاق القائمة">
              <svg aria-hidden="true"><use href="#i-close"></use></svg>
            </button>
          </div>
          <div class="wordmark sidebar-wordmark">
            <svg class="wordmark-flame" aria-hidden="true"><use href="#i-flame"></use></svg>
            <span class="wordmark-name">GRILL HOUSE</span>
            <span class="wordmark-est">EST. 2024</span>
          </div>
          <ul class="nav-list">
            <li><a class="nav-link" href="#home" data-section="home"><svg aria-hidden="true"><use href="#i-home"></use></svg><span>الرئيسية</span></a></li>
            <li><a class="nav-link" href="#categories" data-section="categories"><svg aria-hidden="true"><use href="#i-list"></use></svg><span>الأقسام</span></a></li>
            <li><a class="nav-link" href="#products" data-section="products"><svg aria-hidden="true"><use href="#i-burger"></use></svg><span>المنتجات</span></a></li>
            <li><a class="nav-link" href="#settings" data-section="settings"><svg aria-hidden="true"><use href="#i-info"></use></svg><span>إعدادات المطعم</span></a></li>
            <li><a class="nav-link" href="#password" data-section="password"><svg aria-hidden="true"><use href="#i-lock"></use></svg><span>كلمة المرور</span></a></li>
          </ul>
          <!-- Decorative: the restaurant's own grill photo. -->
          <div class="sidebar-art" aria-hidden="true"></div>
        </nav>
        <div class="nav-backdrop" id="nav-backdrop" hidden></div>

        <main class="content" id="content" tabindex="-1">
          <header class="page-head">
            <h1 class="page-title" id="page-title"></h1>
            <p class="page-desc" id="page-desc"></p>
            <span class="accent-line" aria-hidden="true"></span>
          </header>
          <div id="section"></div>
        </main>
      </div>
    </div>

    <script type="module" src="/grill-admin/js/app.js"></script>
  </body>
</html>
